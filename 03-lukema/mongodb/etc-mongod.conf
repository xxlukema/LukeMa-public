# Short: https://docs.mongodb.com/manual/administration/configuration/ 
# Full:  https://docs.mongodb.com/manual/reference/configuration-options/
security:
   authorization: enabled
setParameter:
   enableLocalhostAuthBypass: false
net:
   bindIp: 127.0.0.1,192.168.1.100,10.8.0.10
   port: 27017
storage:
   dbPath: /srv/data/db
systemLog:
   destination: file
   path: "/var/log/mongodb/mongod.log"
   logAppend: true
processManagement:
   fork: true
storage:
   journal:
      enabled: true
processManagement:
   pidFilePath: /srv/data/db0.pid
   
   
   
   
   
   	  