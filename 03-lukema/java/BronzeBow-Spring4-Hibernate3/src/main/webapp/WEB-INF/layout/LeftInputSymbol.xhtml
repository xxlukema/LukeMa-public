<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

<ui:composition>
	<h:panelGrid columns="2" styleClass="wgrid">
		<f:facet name="header">
			<h:outputText value="Chart Params" />
		</f:facet>

		<h:outputLabel for="stockSymbol" value="Stock" styleClass="bold" />

		<h:inputText id="stockSymbol" value="#{taController.symbol}" size="6"
			required="true" styleClass="required"
			onkeypress="return submitEnter('mainForm:submit',event);">
			<f:validator validatorId="stockSymbolValidator" />
		</h:inputText>
	</h:panelGrid>

	<h:panelGrid columns="1">
		<h:message for="stockSymbol" styleClass="warning" />

		<h:commandButton id="submit" value="Submit"
			action="#{taController.drawChart}" />
	</h:panelGrid>
</ui:composition>

</html>
