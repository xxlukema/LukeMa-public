<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:composition template="/WEB-INF/layout/Layout.xhtml">
		<ui:define name="title">Reset Password Page</ui:define>

		<ui:define name="center">
			<h3>Reset Password</h3>
			<f:view>
				<h:form id="resetPasswordForm">
					<h:panelGrid columns="1"
						style="margin-left: 10px;">
						<h:panelGrid columns="2" styleClass="wgrid">
							<f:facet name="header">
								<h:outputText value="Reset Password" />
							</f:facet>

							<h:outputLabel for="email"
								value="Enter Your Email" styleClass="bold" />

							<h:inputText id="email"
								value="#{resetPasswordController.email}" size="60"
								required="true" styleClass="required">
								<f:validator
									validatorId="emailValidator" />
							</h:inputText>

							<h:outputLabel for="confirmEmail"
								value="Confirm Email" styleClass="bold" />

							<h:inputText id="confirmEmail"
								value="#{resetPasswordController.confirmEmail}" size="60"
								required="true" styleClass="required">
								<f:validator
									validatorId="emailValidator" />
							</h:inputText>
						</h:panelGrid>
						<h:panelGrid columns="1" styleClass="nogrid">
							<h:outputText
								value="#{resetPasswordController.errorMessage}"
								styleClass="warning" />

							<h:message for="email" styleClass="warning" />
							<h:message for="confirmEmail"
								styleClass="warning" />

							<h:commandButton value="Submit"
								action="#{resetPasswordController.resetPassword}" />
						</h:panelGrid>
					</h:panelGrid>
				</h:form>
			</f:view>
		</ui:define>
	</ui:composition>

</html>
