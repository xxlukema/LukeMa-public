<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:composition template="/WEB-INF/layout/Layout.xhtml">
		<ui:define name="title">User Register Page</ui:define>

		<ui:define name="center">
			<f:view>
				<h:form id="registerForm">
					<h:panelGroup style="margin-left: 10px;">
						<h:panelGrid columns="2" styleClass="wgrid">
							<f:facet name="header">
								<h:outputText value="New User Register" />
							</f:facet>

							<h:outputLabel for="username"
								value="Username" styleClass="bold" />

							<h:inputText id="username" name="username"
								value="#{userRegisterController.user.username}" size="20"
								required="true" styleClass="required">
								<f:validator
									validatorId="usernameValidator" />
							</h:inputText>

							<h:outputLabel for="password"
								value="Password" styleClass="bold" />

							<h:inputSecret id="password" name="Password"
								value="#{userRegisterController.user.password}" size="20"
								required="true" styleClass="required">
								<f:validator
									validatorId="passwordValidator" />
							</h:inputSecret>

							<h:outputLabel for="confirmPassword"
								value="Re-Enter Password" styleClass="bold" />

							<h:inputSecret id="confirmPassword"
								name="confirmPassword"
								value="#{userRegisterController.confirmPassword}" size="20"
								required="true" styleClass="required">
								<f:validator
									validatorId="passwordValidator" />
							</h:inputSecret>

							<h:outputLabel for="autoLogin"
								value="Auto Login" styleClass="bold" />

							<h:selectBooleanCheckbox title="autoLogin"
								value="#{userRegisterController.autoLogin}">
							</h:selectBooleanCheckbox>

							<h:outputLabel for="email" value="Email"
								styleClass="bold" />

							<h:inputText id="email" name="email"
								value="#{userRegisterController.user.email}" size="60"
								required="true" styleClass="required">
								<f:validator
									validatorId="emailValidator" />
							</h:inputText>

							<h:outputLabel for="confirmEmail"
								value="Re-Enter Email" styleClass="bold" />

							<h:inputText id="confirmEmail"
								name="confirmEmail"
								value="#{userRegisterController.confirmEmail}" size="60"
								required="true" styleClass="required">
								<f:validator
									validatorId="emailValidator" />
							</h:inputText>

						</h:panelGrid>
						<h:panelGrid columns="1" styleClass="nogrid">
							<h:outputText
								value="#{userRegisterController.errorMessage}"
								styleClass="warning" />

							<h:message for="username"
								styleClass="warning" />
							<h:message for="password"
								styleClass="warning" />
							<h:message for="email" styleClass="warning" />
							<h:message for="confirmEmail"
								styleClass="warning" />

							<h:commandButton value="Submit"
								action="#{userRegisterController.register}" />
						</h:panelGrid>
					</h:panelGroup>
				</h:form>
			</f:view>
		</ui:define>
	</ui:composition>

</html>
