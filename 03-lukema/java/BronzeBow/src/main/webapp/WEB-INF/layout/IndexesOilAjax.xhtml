<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<ui:composition>
	<h:form id="ajax4jsfForm">
		<h:panelGrid columns="8" styleClass="indexesAjax">
			<f:facet name="header">
				<h:outputText value="Indexes" />
			</f:facet>

			<h:outputText id="nasdaqSymbol" value="Nasdaq" styleClass="symbol" />

			<h:outputText id="nasdaqValue" value="#{nasdaqWatcher.value}"
				rendered="#{nasdaqWatcher.up}" styleClass="up" />

			<h:outputText id="nasdaqValue0" value="#{nasdaqWatcher.value}"
				rendered="#{!nasdaqWatcher.up}" styleClass="down" />

			<h:outputText id="nasdaqChange" value="#{nasdaqWatcher.change}"
				rendered="#{nasdaqWatcher.up}" styleClass="up" />

			<h:outputText id="nasdaqChange0" value="#{nasdaqWatcher.change}"
				rendered="#{!nasdaqWatcher.up}" styleClass="down" />

			<h:outputText id="nasdaqPctChange" value="#{nasdaqWatcher.pctChange}"
				rendered="#{nasdaqWatcher.up}" styleClass="up" />

			<h:outputText id="nasdaqPctChange0"
				value="#{nasdaqWatcher.pctChange}" rendered="#{!nasdaqWatcher.up}"
				styleClass="down" />

			<h:outputText id="oilSymbol" value="Oil" styleClass="symbol" />

			<h:outputText id="oilValue" value="#{oilWatcher.value}"
				rendered="#{oilWatcher.up}" styleClass="up" />

			<h:outputText id="oilValue0" value="#{oilWatcher.value}"
				rendered="#{!oilWatcher.up}" styleClass="down" />

			<h:outputText id="oilChange" value="#{oilWatcher.change}"
				rendered="#{oilWatcher.up}" styleClass="up" />

			<h:outputText id="oilChange0" value="#{oilWatcher.change}"
				rendered="#{!oilWatcher.up}" styleClass="down" />

			<h:outputText id="oilPctChange" value="#{oilWatcher.pctChange}"
				rendered="#{oilWatcher.up}" styleClass="up" />

			<h:outputText id="oilPctChange0" value="#{oilWatcher.pctChange}"
				rendered="#{!oilWatcher.up}" styleClass="down" />
		</h:panelGrid>
	</h:form>

	<hr />

	<div>Click Button below</div>
	<h:form id="pushForm">
		<h:outputText id="counter" value="#{globalCounter.count}"
			styleClass="ui-widget display" />

		<br />

		<h:commandButton value="Click"
			actionListener="#{globalCounter.buttonClicked}" />
	</h:form>

	<p:socket onMessage="handleMessage" channel="/counter" />
	<!-- The following script is required! -->
	<script type="text/javascript">
		function handleMessage(data) {
			$('.display').html(data);
		}
	</script>

	<div>Click Button Above</div>


</ui:composition>
</html>
