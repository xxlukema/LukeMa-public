<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:composition>
		<h:panelGroup>
			<h:panelGrid columns="1" styleClass="wgrid"
				rendered="#{!userLoginController.userLoggedIn}">
				<f:facet name="header">
					<h:outputText value="My List" />
				</f:facet>

				<h:commandButton value="Login for My List"
					action="#{taController.toLogin}">
				</h:commandButton>
			</h:panelGrid>

			<h:dataTable value="#{taController.myListRowList}"
				var="myListRow" styleClass="wgrid"
				rendered="#{userLoginController.userLoggedIn}">
				<f:facet name="header">
					<h:panelGroup>
						<h:outputText value="My List " />
						<h:commandLink value="[ Edit ]" immediate="true"
							action="#{userLoginController.toMyListEditor}">
						</h:commandLink>
					</h:panelGroup>
				</f:facet>

				<h:column>
					<h:commandLink value="#{myListRow.symbol1}"
						actionListener="#{taController.symbolLinkClickedActionListener}"
						action="#{taController.drawChart}">
						<f:attribute name="#{taController.symbolString}"
							value="#{myListRow.symbol1}" />
					</h:commandLink>
				</h:column>

				<h:column>
					<h:commandLink value="#{myListRow.symbol2}"
						actionListener="#{taController.symbolLinkClickedActionListener}"
						action="#{taController.drawChart}">
						<f:attribute name="#{taController.symbolString}"
							value="#{myListRow.symbol2}" />
					</h:commandLink>
				</h:column>

				<h:column>
					<h:commandLink value="#{myListRow.symbol3}"
						actionListener="#{taController.symbolLinkClickedActionListener}"
						action="#{taController.drawChart}">
						<f:attribute name="#{taController.symbolString}"
							value="#{myListRow.symbol3}" />
					</h:commandLink>
				</h:column>
			</h:dataTable>
		</h:panelGroup>
	</ui:composition>

</html>
