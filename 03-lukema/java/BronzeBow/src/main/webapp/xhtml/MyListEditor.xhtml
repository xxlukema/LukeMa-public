<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:composition template="/WEB-INF/layout/Layout.xhtml">
		<ui:define name="title">Edit My List Page</ui:define>

		<ui:define name="center">
			<h3>Edit My List</h3>
			<f:view>
				<h:form id="myListEditForm">
					<h:panelGrid columns="1" style="margin-left: 10px;"
						styleClass="nogrid">
						<h:outputLabel for="myList"
							value="My Stock List can store up to 30 stock symbols/tickers, separated by spaces."
							styleClass="bold" />
						<h:inputTextarea id="myList" rows="6" cols="50"
							value="#{myListEditorController.user.stockList}" />
					</h:panelGrid>
					<h:panelGrid columns="1" style="margin-left: 10px;"
						styleClass="nogrid">
						<h:outputText
							value="#{myListEditorController.errorMessage}"
							rendered="#{!empty myListEditorController.errorMessage}"
							styleClass="warning" />
						<h:commandButton value="Submit"
							action="#{myListEditorController.save}" />
					</h:panelGrid>
				</h:form>
			</f:view>
		</ui:define>
	</ui:composition>

</html>
