<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core">

	<ui:composition template="/WEB-INF/layout/Layout.xhtml">
		<ui:define name="title">Change Password Page</ui:define>

		<ui:define name="center">
			<h3>Change Password</h3>
			<f:view>
				<h:form id="changePasswordForm">
					<h:panelGrid columns="1"
						style="margin-left: 10px;">
						<h:panelGrid columns="2" styleClass="wgrid">
							<f:facet name="header">
								<h:outputText value="Change Password" />
							</f:facet>

							<h:outputLabel for="username"
								value="Username" styleClass="bold" />

							<h:outputText id="username" name="username"
								value="#{changePasswordController.user.username}">
							</h:outputText>

							<h:outputLabel for="currentPassword"
								value="Current Password" styleClass="bold" />

							<h:inputSecret id="currentPassword"
								name="currentPassword"
								value="#{changePasswordController.currentPassword}" size="20"
								required="true" styleClass="required">
								<f:validator
									validatorId="passwordValidator" />
							</h:inputSecret>

							<h:outputLabel for="newPassword"
								value="New Password" styleClass="bold" />

							<h:inputSecret id="newPassword"
								name="newPassword"
								value="#{changePasswordController.newPassword}" size="20"
								required="true" styleClass="required">
								<f:validator
									validatorId="passwordValidator" />
							</h:inputSecret>

							<h:outputLabel for="confirmNewPassword"
								value="Confirm New Password" styleClass="bold" />

							<h:inputSecret id="confirmNewPassword"
								name="confirmNewPassword"
								value="#{changePasswordController.confirmNewPassword}" size="20"
								required="true" styleClass="required">
								<f:validator
									validatorId="passwordValidator" />
							</h:inputSecret>
						</h:panelGrid>
						<h:panelGrid columns="1" styleClass="nogrid">
							<h:outputText
								value="#{changePasswordController.errorMessage}"
								styleClass="warning" />

							<h:message for="currentPassword"
								styleClass="warning" />
							<h:message for="newPassword"
								styleClass="warning" />
							<h:message for="confirmNewPassword"
								styleClass="warning" />

							<h:commandButton value="Submit"
								action="#{changePasswordController.changePassword}" />
						</h:panelGrid>
					</h:panelGrid>
				</h:form>
			</f:view>
		</ui:define>
	</ui:composition>

</html>
