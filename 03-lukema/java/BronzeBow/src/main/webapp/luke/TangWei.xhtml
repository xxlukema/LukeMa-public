<center><i><b> ~刘欢-千百次的问~<br />
<br />
千万里我追寻着你<br />
可是你却并不在意<br />
你不象是在我梦里<br />
在梦里你是我的唯一<br />
Time and time again you ask me<br />
问我到底爱不爱你<br />
Time and time again i ask myself<br />
问自己是否离的开你<br />
我今生看来注定要独行<br />
热情已被你耗尽<br />
我已经变的不再是我<br />
可是你却依然是你<br />
问我到底恨不恨你<br />
问自己你到底好在哪里<br />
好在那里<br />
<br />
