<section>
    <!-- Toggle dark mode -->
    <div style="text-align: right; margin-top: 2px;">
        <button (click)="toggleDarkMode()" [disabled]="darkMode" [class]="darkMode ? 'disabled' : 'enabled'">Dark
            Mode</button>
        <span style="margin: 10px;"></span>
        <button (click)="toggleDarkMode()" [disabled]="!darkMode" [class]="darkMode ? 'enabled' : 'disabled'">Normal
            Mode</button>
    </div>
</section>
