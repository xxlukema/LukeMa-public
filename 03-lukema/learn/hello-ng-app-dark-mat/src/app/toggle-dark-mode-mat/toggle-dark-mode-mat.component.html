<mat-card>
  <mat-card-content fxLayout fxLayoutAlign="end">
    <section fxLayout fxLayoutAlign="end" fxLayoutGap="0.2em" (click)="toggleDarkMode()" tooltip="Toggle Light/Dark Theme"
      [options]="toolTipOptions" style="cursor: pointer;">
      <div>
        <span *ngIf="!darkMode">Light</span><span *ngIf="darkMode">Dark</span> Mode
      </div>
      <div fxFlex="2em" [class.isActive]="!darkMode">
        <i class="fa-regular fa-sun fa-lg"></i>
      </div>
      <!--
      <mat-slide-toggle (change)="toggleDarkMode()"></mat-slide-toggle>
      -->
      <div fxFlex="2em" [class.isActive]="darkMode">
        <i class="fa-regular fa-moon fa-lg"></i>
      </div>
    </section>
  </mat-card-content>
</mat-card>
