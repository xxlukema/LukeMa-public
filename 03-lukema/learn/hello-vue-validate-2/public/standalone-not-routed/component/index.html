<html>

<head>
    <meta charset="utf-8">
    <title>Stand alone vue app</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="description" content="Lifeline IT LSS" />
    <meta name="keywords" content="LSS, Lifeline" />
    <meta http-equiv="Cache-control" content="no-cache">
    <meta content="no-cache" http-equiv="Cache-Control" />
    <meta content="no-cache" http-equiv="Pragma" />
    <meta http-equiv="EXPIRES" content="0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
    <link rel="stylesheet" href="index.css">
    <script src="https://cdn.jsdelivr.net/npm/vue/dist/vue.js"></script>
</head>

<body>

    <h3>Standalone with Components</h3>

    <div id="app">
        <h3>app</h3>

        <ol>
            <todo-item></todo-item>
        </ol>
    </div>

    <div id="app-7">
        <h3>app-7</h3>

        <ol>
            <!--
                Now we provide each todo-item with the todo object
                it's representing, so that its content can be dynamic.
                We also need to provide each component with a "key",
                which will be explained later.
             -->
            <todo-item-2 v-for="item in groceryList" v-bind:todo="item" v-bind:key="item.id"></todo-item-2>
        </ol>

        <p>Foo: {{ foo }}</p>
        <!-- this will no longer update `foo`! -->
        <button v-on:click="foo = 'Setting baz to new value of foo'">Change it</button>

    </div>

    <br>

    <div id="add-1">
        <h3>add-1</h3>

        <ol>
            <todo-item></todo-item>
        </ol>

        <button @click="counter += 1">add 1</button>
        <p>The button above has been clicked {{ counter }} times.</p>
    </div>

    <script src="index.js"></script>
</body>

</html>
