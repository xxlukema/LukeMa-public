services:
  reverse:
    image: nginx:latest
    container_name: keycloak-reverse-lma
    # restart: always
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../tls:/etc/nginx/ssl:ro
    ports:
      - 443:443
    networks:
      - keycloaknet
    # network_mode: host

networks:
  keycloaknet:
    external: true
    name: keycloaknet-lma
    