# Hikari
# maximumPoolSize - Default: 10
spring.datasource.hikari.maximumPoolSize=3
# minimumIdle - Default: maximumPoolSize. It is recommanded recommend not setting this value and instead allowing HikariCP
# to act as a fixed size connection pool. Default: same as maximumPoolSize
# spring.datasource.hikari.minimumIdle=3
# idleTimeout - Default: 600000 (10 minutes)
# HikariCP closes and renews connections every 30 minutes (maxLifetime default 1800000 (30 minutes))
spring.datasource.hikari.maxLifetime=1800000
# spring.datasource.connection-init-sql=ALTER SESSION SET CURRENT_SCHEMA=ECOR_OWNER
spring.datasource.hikari.poolName=Luke_Hikari_Pool


spring.datasource.tomcat.initial-size=3
spring.datasource.tomcat.max-active=3
spring.datasource.tomcat.max-age=300000
spring.datasource.tomcat.validation-interval=30000
spring.datasource.tomcat.test-while-idle=true

