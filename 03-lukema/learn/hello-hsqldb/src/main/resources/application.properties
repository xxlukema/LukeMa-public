# by default, it only expose info and health. user comma delimiter. * will expose all 13 endpoints.
management.endpoints.web.exposure.include=*
management.endpoints.web.exposure.exclude=beans

# shutdown endpoint is disabled by default
# curl -k -i -X POST https://localhost:8443/actuator/shutdown
management.endpoint.shutdown.enabled=true

# never, authorized, always
management.endpoint.health.show-details=always

# pl.project13.maven:git-commit-id-plugin
management.info.git.mode=full
management.info.java.enabled=false
management.info.env.enabled=true
