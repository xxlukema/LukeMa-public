 * User Manual available at https://docs.gradle.org/6.8.3/userguide/building_java_projects.html
 */

plugins {
    id 'java'
    id 'eclipse'
    
    id 'maven-publish'
    
    // This is equivalent to specify spring-boot-starter-parent version
    // id 'org.springframework.boot' version '2.5.1'
    // spring boot dependency version manager
    // id 'io.spring.dependency-management' version '1.0.11.RELEASE'
}

repositories {
    // The RepositoryHandler.jcenter() method has been deprecated. This is scheduled to be removed in Gradle 8.0.
    // JFrog announced JCenter's shutdown in February 2021. Use mavenCentral() instead.
    // jcenter()
    mavenCentral()
}

dependencies {

    implementation 'org.apache.logging.log4j:log4j-api:2.14.1'
    implementation 'org.apache.logging.log4j:log4j-core:2.14.1'

    // cucumber-java8 is for writing test steps using java8 expressions:
    // testImplementation 'io.cucumber:cucumber-java8:6.10.4'
    
    // If not using java8 expressions for steps, and just using annotations, use cucumber-java
    testImplementation 'io.cucumber:cucumber-java:6.10.4'
    testImplementation 'io.cucumber:cucumber-junit:6.10.4'
    
    // Cucumber is based on JUnit 4. If you are using JUnit 5, remember to include junit-vintage-engine dependency, as well.
    // testRuntimeOnly 'org.junit.jupiter:junit-vintage-engine:5.7.2'
    // testRuntimeOnly 'io.cucumber:cucumber-junit-platform-engine:6.10.4'
    
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.7.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.7.2'
    
    
    // testImplementation("org.junit.jupiter:junit-jupiter-api:latest.release") {
    //     because("we want to use JUnit 5 assertions")
    // }
    // testImplementation("io.cucumber:cucumber-junit-platform-engine:latest.release") {
    //     because("we want to use Cucumber with JUnit 5")
    // }
    
    
    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.20'
    annotationProcessor 'org.projectlombok:lombok:1.18.20'
    testCompileOnly 'org.projectlombok:lombok:1.18.20'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.20'
}

tasks.named('test') {
    useJUnitPlatform()
}

configurations {
    cucumberRuntime {
        extendsFrom testImplementation
    }
}

task cucumber() {
    dependsOn assemble, testClasses
    doLast {
        javaexec {
            mainClass = "io.cucumber.core.cli.Main"
            classpath = configurations.cucumberRuntime + sourceSets.main.output + sourceSets.test.output
            args = ['--plugin', 'pretty',
                    '--plugin', 'html:build/cucumber-html-report.htm',
                    '--plugin', 'json:build/cucumber-json-report.json',
                    '--glue', 'com.learn.cucumber.step.test',
                    'classpath:']
                    // Or
                    // 'classpath:com/learn/cucumber/step/test']
                    // 'src/test/resources']
        }
    }
}


