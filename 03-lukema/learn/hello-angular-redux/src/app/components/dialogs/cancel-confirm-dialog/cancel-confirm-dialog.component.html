<section>
    <div fxLayout="row" style="color: white; background-color: darkblue;">
        <span fxFlex="auto" class="vcenter" style="padding: 0 0.5em;">{{cancelConfirmDialogData.title}}</span>
        <span fxFlex="none" class="vcenter mat-icon-close">
            <mat-icon (click)="close(true)">close</mat-icon>
        </span>
    </div>

    <mat-dialog-content>
        <p style="padding: 0 0.5em;">{{cancelConfirmDialogData.content}}</p>
    </mat-dialog-content>

    <mat-dialog-actions fxLayout="row" fxLayoutAlign="center center">
        <button fxFlex="none" class="mat-raised-button" mat-button style="margin-right:10px;"
            (click)="cancel()">{{cancelConfirmDialogData.cancelButtonLabel}}</button>
        <button fxFlex="none" class="mat-raised-button" mat-button color="primary"
            (click)="confirm()">{{cancelConfirmDialogData.confirmButtonLabel}}</button>
    </mat-dialog-actions>
</section>
