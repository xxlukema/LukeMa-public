<!DOCTYPE html>
<html>
<head>
<title>Form to create a new resource</title>
<link rel="stylesheet"
	href="http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css" />
<script src="http://code.jquery.com/jquery-1.9.1.js"></script>
<script src="http://code.jquery.com/ui/1.10.3/jquery-ui.js"></script>
<style>
#ajaxDiv {
	width: 200px;
	height: 60px;
	padding: 0.5em;
	margin: 10px 10px 10px 0;
}
</style>
</head>
<body>
	<div>
		<h3>Form Post with Parameters</h3>
		<form id="form1" action="rest/todoCrud/formPost" method="POST">
			<table border="1">
				<tr>
					<td align="right"><label for="id">ID</label></td>
					<td><input name="id" /></td>
				</tr>
				<tr>
					<td align="right"><label for="summary">Summary</label></td>
					<td><input name="summary" /></td>
				</tr>
				<tr>
					<td align="right"><label for="description">
							Description:</label></td>
					<td><TEXTAREA NAME="description" COLS=40 ROWS=3></TEXTAREA></td>
				</tr>
				<tr>
					<td colspan="2" align="center"><input type="submit"
						value="Submit (Don't Click This Button!)" /></td>
				</tr>
			</table>
		</form>
	</div>

	<div>
		<h3>Ajax</h3>

		<div>
			<div id="ajaxDiv">
				<p>OnSubmit, Todo will be displayed here.</p>
			</div>

			<input type="submit" value="Submit" onclick="testWsRest();" />
		</div>

		<script type="text/javascript">
			function testWsRest() {
				$
						.ajax({
							dataType : 'json',
							headers : {
								Accept : "application/json",
								"Access-Control-Allow-Origin" : "*"
							},
							type : 'GET',
							url : 'http://localhost:8080/MyRest/rest/todoCrud/callJSon/101',
							success : function(todo) {

								var str = "id : " + todo.id + ", "
										+ "Summary : " + todo.summary + ", "
										+ "Description : " + todo.description;

								$("div#ajaxDiv").text(str);
								alert("Success! Text displayed.");
							},
							error : function(todo) {
								alert("Error. Try curl -i -H \"Content-Type: application/json\" -X GET http://localhost:8080/MyRest/rest/todoCrud/callJSon/101");
							}
						});
			}
		</script>

	</div>

</body>
</html>
