<!DOCTYPE html>
<html>
<head>
<title>Form to create a new resource</title>
<link rel="stylesheet"
	href="http://code.jquery.com/ui/1.10.3/themes/smoothness/jquery-ui.css" />
<script src="http://code.jquery.com/jquery-2.1.0.min.js"></script>
<script src="http://code.jquery.com/ui/1.10.3/jquery-ui.js"></script>
<style>
#ajaxDiv {
	width: 200px;
	height: 60px;
	padding: 0.5em;
	margin: 10px 10px 10px 0;
}
</style>
<style type="text/css">
div {
	margin-bottom: 20px;
	padding: 2px;
	display: block;
}
</style>
</head>
<body>
	<div>
		<h3>Call Google</h3>
		<button onclick="$('div#demo').text(Date());">What is the
			time?</button>
	</div>

	<div id="demo"></div>

	<div>
		<h3>Ajax</h3>

		<div>
			<div id="ajaxDiv">
				<p>OnSubmit, Todo will be displayed here.</p>
			</div>

			<input type="submit" value="Submit" onclick="testWsRest();" />
		</div>

		<script type="text/javascript">
			function testWsRest() {
				$
						.ajax({
							dataType : 'json',
							headers : {
								Accept : "application/json",
								"Access-Control-Allow-Origin" : "*"
							},
							type : 'GET',
							url : 'http://localhost:9999/MyRest/rest/todoCrud/callJSon/101',
							success : function(todo) {

								var str = "id : " + todo.id + ", "
										+ "Summary : " + todo.summary + ", "
										+ "Description : " + todo.description;

								$("div#ajaxDiv").text(str);
								alert("Success! Text displayed.");
							},
							error : function(response) {
								console.log(response);
								alert("Error. Try curl -i -H \"Content-Type: application/json\" -X GET http://localhost:8080/MyRest/rest/todoCrud/callJSon/101");
							}
						});
			}
		</script>

	</div>

	<div id="images"></div>
	<script>
		(function() {
			var flickerAPI = "http://api.flickr.com/services/feeds/photos_public.gne?jsoncallback=?";

			$
					.ajax({
						dataType : 'json',
						headers : {
							Accept : "application/json",
							"Access-Control-Allow-Origin" : "*"
						},
						type : 'GET',
						url : flickerAPI,
						data : {
							"tags" : "mount rainier",
							"tagmode" : "any",
							"format" : "json",
							"method" : "flickr.interestingness.getList"
						},
						success : function(data) {

							$.each(data.items, function(i, item) {
								$("<img>").attr("src", item.media.m).appendTo(
										"#images");
								if (i === 3) {
									return false;
								}
							});

						},
						error : function(response) {
							console.log(response);
							alert("Error. Try curl -i -H \"Content-Type: application/json\" -X GET "
									+ flickerAPI);
						}
					});
		})();
	</script>

</body>
</html>
