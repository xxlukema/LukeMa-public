<div class=Section1>

<h2 align=center style='text-align:center'>Returning TOP N Records</h2>

<p><strong><span style='font-size:14.0pt'><o:p>&nbsp;</o:p></span></strong></p>

<p><strong><span style='font-size:14.0pt'>Microsoft SQL Server:</span></strong><span
style='font-size:14.0pt'><o:p></o:p></span></p>

<pre><span style='font-size:14.0pt'>SELECT <strong><span style='font-family:
"Courier New"'>TOP 10</span></strong> <span class=GramE>column</span> FROM table<o:p></o:p></span></pre>

<p><span class=SpellE><strong><span style='font-size:14.0pt'>PostgreSQL</span></strong></span><strong><span
style='font-size:14.0pt'> and <span class=SpellE>MySQL</span>:</span></strong><span
style='font-size:14.0pt'><o:p></o:p></span></p>

<pre><span style='font-size:14.0pt'>SELECT column FROM table<o:p></o:p></span></pre><pre><strong><span
style='font-size:14.0pt;font-family:"Courier New"'>LIMIT 10</span></strong><span
style='font-size:14.0pt'><o:p></o:p></span></pre>

<p><strong><span style='font-size:14.0pt'>Oracle:</span></strong><span
style='font-size:14.0pt'><o:p></o:p></span></p>

<pre><span style='font-size:14.0pt'>SELECT column FROM table<o:p></o:p></span></pre><pre><strong><span
style='font-size:14.0pt;font-family:"Courier New"'>WHERE ROWNUM &lt;= 10</span></strong><span
style='font-size:14.0pt'><o:p></o:p></span></pre>

<p><strong><span style='font-size:14.0pt'>Sybase:</span></strong><span
style='font-size:14.0pt'><o:p></o:p></span></p>

<pre><strong><span style='font-size:14.0pt;font-family:"Courier New"'>SET <span
class=SpellE>rowcount</span> 10</span></strong><span style='font-size:14.0pt'><o:p></o:p></span></pre><pre><span
style='font-size:14.0pt'>SELECT column FROM table<o:p></o:p></span></pre>

<p><strong><span style='font-size:14.0pt'>Firebird:</span></strong><span
style='font-size:14.0pt'><o:p></o:p></span></p>

<pre><span style='font-size:14.0pt'>SELECT <strong><span style='font-family:
"Courier New"'>FIRST 10</span></strong> <span class=GramE>column</span><o:p></o:p></span></pre><pre><span
style='font-size:14.0pt'>FROM table<o:p></o:p></span></pre>

<p class=MsoNormal><span style='font-size:14.0pt'><o:p>&nbsp;</o:p></span></p>
