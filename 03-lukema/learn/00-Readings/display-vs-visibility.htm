<!DOCTYPE html>
<html>
<head>
<style>
legend { 
    display: block;
    padding-left: 2px;
    padding-right: 2px;
    border: 0px solid blue;
}
</style>
</head>
<body>


	<fieldset>
		<legend>visibility:hidden vs display:none</legend>
		======= display:none start ======
		<div style="display:none">
			<span id="display-none">Not displayed + Not taking space.</span>
		</div>
		======= display:none end ======
		<div></div>
		------- visibility:hidden start ------
		<div style="visibility:hidden">
			<span id="visibility-hidden">Not displayed + But takes space.</span>
		</div>
		------- visibility:hidden end ------
		<br />
		<label for="display-none-value">display:none value: <label>
		<span id="display-none-value">111
			<script>
				var display = document.getElementById("display-none").innerHTML;
				document.getElementById("display-none-value").innerHTML = display;
			</script>
		</span>
		<br />
		<label for="visibility-hidden-value">visibility:hidden value: <label>
		<span id="visibility-hidden-value">222
			<script>
				var display = document.getElementById("visibility-hidden").innerHTML;
				document.getElementById("visibility-hidden-value").innerHTML = display;
			</script>
		</span>
	</fieldset>

	1st <a href="http://example.com" style="display: none;">unseen</a> link.<br />
	2nd <a href="http://example.com" style="visibility: hidden;">unseen</a> link.<br />
	3rd <a href="http://example.com" style="opacity: 0;">unseen</a> link.

</body>
</html>
