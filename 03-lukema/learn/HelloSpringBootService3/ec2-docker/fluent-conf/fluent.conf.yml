conf:
  - source:
      $type: forward
      $label: "@WEB_LOG"
      tag: shein.web
      port: 9880
      bind: 0.0.0.0

  # for all `stdout/stderr` from other containers with `services.*.logging.driver=fluentd` docker-compose configuration
  - source:
      # confiured in `compose.yml` `services.web.logging.tag='from-web-lma'`
      # confiured in `compose.yml` `services.boot.logging.tag='from-boot-lma'`
      $type: forward
      $label: "@BOOT_LOG"  # dstat events are routed to <label @FLUENT_LOG>
      tag: shein.boot
      port: 24224
      bind: 0.0.0.0

  - label:
      # `$label` parameter value should be `quoted`
      $name: "@WEB_LOG"
      # `label` element should contain `config` element
      config:
        # - filter:
        #    $tag: var.log.middleware.**
        #    $type: grep
        - match:
            # logs forwarded from boot (confiured in `compose.yml` `logging.tag='from-boot-lma'`)
            $tag: "shein.web"
            $type: copy
            match:
              - store:
                  $type: "stdout"
              - store:
                  $type: file
                  path: /fluentd-store/web/shein.web/${tag}.log
        - match:
            # logs forwarded from nginx (confiured in `compose.yml` `logging.tag='from-web-lma'`)
            $tag: "from-web-lma"
            $type: copy
            match:
              - store:
                  $type: "stdout"
              - store:
                  $type: file
                  path: /fluentd-store/web/from-web-lma/${tag}.log
        - match:
            # logs forwarded from nginx (confiured in `compose.yml` `logging.tag='from-web-lma'`)
            $tag: "**"
            $type: copy
            match:
              - store:
                  $type: "stdout"
              - store:
                  $type: file
                  path: /fluentd-store/web/unmatched/${tag}.log
  - label:
      # `$label` parameter value should be `quoted`
      $name: "@BOOT_LOG"
      # `label` element should contain `config` element
      config:
        # - filter:
        #    $tag: var.log.middleware.**
        #    $type: grep
        - match:
            # logs forwarded from boot (confiured in `compose.yml` `logging.tag='from-boot-lma'`)
            $tag: "shein.boot"
            $type: copy
            match:
              - store:
                  $type: "stdout"
              - store:
                  $type: file
                  path: /fluentd-store/boot/shein.boot/${tag}.log
        - match:
            # logs forwarded from boot (confiured in `compose.yml` `logging.tag='from-boot-lma'`)
            $tag: "from-boot-lma"
            $type: copy
            match:
              - store:
                  $type: "stdout"
              - store:
                  $type: file
                  path: /fluentd-store/boot/from-boot-lma/${tag}.log
        - match:
            # logs forwarded from nginx (confiured in `compose.yml` `logging.tag='from-web-lma'`)
            $tag: "**"
            $type: copy
            match:
              - store:
                  $type: "stdout"
              - store:
                  $type: file
                  path: /fluentd-store/boot/unmatched/${tag}.log
  - label:
      # `$label` parameter value should be `quoted`
      $name: "@FLUENT_LOG"
      # `label` element should contain `config` element
      config:
        # - filter:
        #    $tag: var.log.middleware.**
        #    $type: grep
        - match:
            # logs forwarded from boot (confiured in `compose.yml` `logging.tag='from-boot-lma'`)
            $tag: "**"
            $type: copy
            match:
              - store:
                  $type: "stdout"
              - store:
                  $type: file
                  path: /fluentd-store/fluent/all-unmatched/${tag}.log
