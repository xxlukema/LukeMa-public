
<system>
  <log>
    rotate_age 5
    rotate_size 1048576
  </log>
</system>

<source>
  @type forward
  port 9880
  bind 0.0.0.0
  @label @WEB_LOG
  tag shein.web
</source>

<source>
  @type forward
  @label @BOOT_LOG  # dstat events are routed to <label @FLUENT_LOG>
  tag shein.boot
  #
  # this block had already been tagged with 'from-web-lma' and 'from-boot-lma' inside `compose.yml`
  # important! adding another tag is OK (do not know why yet)
  port 24224
  bind 0.0.0.0
</source>

<label @WEB_LOG>
  ## no effect, because `<match shein.web>>` cought it. comment out.
  # <match from-web-lma>
  #   @type file
  #   path /fluentd-store/web/from-web-lma/${tag}
  #   append true
  #   <buffer tag>
  #     # default 60s
  #     flush_interval 5s
  #   </buffer>
  # </match>

  ## no effect, because `<match shein.web>` cought it. comment out.
  # <match from-ingress-lma>
  #   @type file
  #   path /fluentd-store/web/from-ingress-lma/${tag}
  #   append true
  #   <buffer tag>
  #     # default 60s
  #     flush_interval 5s
  #   </buffer>
  # </match>

  <match shein.web>
    @type file
    path /fluentd-store/web/shein.web/${tag}
    append true
    <buffer tag>
      # default 60s
      flush_interval 5s
    </buffer>
  </match>

  # place the widest matches at bottom
  # all un-macthed patterns, `fluent.info`, `fluent.warn`, and `fluent.error`
  <match **>
    @type file
    path /fluentd-store/web/all-unmatched/${tag}
    append true
    <buffer tag>
      # default 60s
      flush_interval 5s
    </buffer>
  </match>
</label>

<label @BOOT_LOG>
  <match shein.boot>
    @type file
    path /fluentd-store/boot/shein.boot/${tag}
    append true
    <buffer tag>
      # default 60s
      flush_interval 5s
    </buffer>
  </match>

  ## no effect, because `<match shein.boot>` cought it. comment out.
  # <match from-boot-lma>
  #   @type file
  #   path /fluentd-store/boot/from-boot-lma/${tag}
  #   append true
  #   <buffer tag>
  #     # default 60s
  #     flush_interval 5s
  #   </buffer>
  # </match>

  # place the widest matches at bottom
  # all un-macthed patterns, `fluent.info`, `fluent.warn`, and `fluent.error`
  <match **>
    @type file
    path /fluentd-store/boot/all-unmatched/${tag}
    append true
    <buffer tag>
      # default 60s
      flush_interval 5s
    </buffer>
  </match>
</label>

<label @FLUENT_LOG>
  # place the widest match to the bottom of all matched
  # no trigger was found yet based observation
  <match **>
    @type file
    path /fluentd-store/fluent/all-fluent/${tag}
    append true
    <buffer tag>
      # default 60s
      flush_interval 5s
    </buffer>
  </match>
</label>
