version: "3"
services:
  ingress:
    image: nginx:1.26.0-alpine-slim
    container_name: ingress-lma
    # restart:
    #   on-failure
    volumes:
      - ./webapp:/usr/share/nginx/html:ro
      - ./nginx-ingress-conf/default-nginx-ingress.conf:/etc/nginx/conf.d/default.conf:rw
      - ${HOME}/luke-ma-web.com:/etc/nginx/ssl:ro
    ports:
      - 443:443
    # network_mode: host
    networks:
      - bridge
    #######################################
    # send 'stdout/stderr' to fluentd
    #######################################
    logging:
      driver: fluentd
      options:
        tag: from-ingress-lma
        fluentd-address: localhost:9880
        fluentd-async-connect: 'true'
        fluentd-retry-wait: '10s'
        fluentd-max-retries: '10'

  web:
    image: xxlukema/hello-shein-web:0.0.2
    pull_policy: always
    container_name: web-lma
    ports:
      - 9443:443
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    # network_mode: host
    networks:
      - bridge
    # this dependency might cause hang with "dc down", because `fluentd` is stopped before `nginx` as required by the `link`, but `web` keeps tring to reconnect to `fluentd`
    # links:
    #   - fluentd
    #######################################
    # send 'stdout/stderr' to fluentd
    #######################################
    logging:
      driver: fluentd
      options:
        tag: from-web-lma
        fluentd-address: localhost:9880
        fluentd-async-connect: 'true'
        fluentd-retry-wait: '10s'
        fluentd-max-retries: '10'

  boot:
    # v0.0.2 logs to 'stdout/stderr'
    image: xxlukema/hello-shein-boot:0.0.2
    pull_policy: always
    container_name: boot-lma
    volumes:
      - /shein-images:/shein-images:rw
    ports:
      - 8443:8443
    # extra_hosts:
    #    - host.docker.internal:host-gateway
    # network_mode: host
    networks:
      - bridge
    # this dependency might cause hang with "dc down", because `fluentd` is stopped before `boot` as required by the `link`, but `boot` keeps tring to reconnect to `fluentd`
    # links:
    #   - fluentd
    #######################################
    # send 'stdout/stderr' to fluentd
    # if use log file source, then comment out this logger (optional), because logs are routed to log file, and is not using 'stdout/stderr'
    #######################################
    logging:
      driver: fluentd
      options:
        tag: from-boot-lma
        fluentd-address: localhost:24224
        fluentd-async-connect: 'true'
        fluentd-retry-wait: '10s'
        fluentd-max-retries: '10'

  fluentd:
    image: fluentd
    container_name: fluentd-lma
    user: root
    volumes:
      # fluent.conf mount point
      - ${HOME}/ec2-docker/fluent-conf/:/fluentd/etc/:rw
      ## !!! Trick
      # fluentd file store mount point for all the log file. log files are defined in `fluent.conf`.
      - ${HOME}/fluentd-store/:/fluentd-store/:rw    # <======= critical! must have
    ports:
      - 9880:9880 # <== web
      - 24224:24224
      - 24224:24224/udp
    # extra_hosts:
    #   - host.docker.internal:host-gateway
    # network_mode: host
    networks:
      - bridge

networks:
  bridge:
    external: false
    driver: bridge
    name: bridge-lma
