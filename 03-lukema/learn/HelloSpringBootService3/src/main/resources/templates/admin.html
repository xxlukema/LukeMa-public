<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/security/tags">

<head>
    <title>Thymeleaf + Security - Admin</title>
    <div th:insert="fragments/header :: header-meta"></div>
    <div th:insert="fragments/header :: header-css"></div>
</head>

<body>

    <div th:insert="fragments/header :: header-nav"></div>

    <div class="container">

        <div class="starter-template">
            <h1>Admin page (Spring Security protected)</h1>

            <h3 th:inline="text">
                Hello [[${#httpServletRequest.remoteUser}]]!
            </h3>
            <!-- When POST actions /login or /logout is called, HttpSecurity.formLogin() or HttpSecurity.logout() will be invoked. -->
            <form th:action="@{/logout}" method="post">
                <input type="submit" value="Sign Out" />
            </form>

        </div>

    </div>
    <!-- /.container -->

    <div class="container">
        <div th:insert="fragments/footer :: footer"></div>
    </div>

</body>

</html>
