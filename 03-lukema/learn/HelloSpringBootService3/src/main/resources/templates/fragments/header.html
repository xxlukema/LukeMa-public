<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
<div th:fragment="header-meta">
    <meta charset="ISO-8859-1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta content="no-cache" http-equiv="Cache-Control" />
    <meta content="no-cache" http-equiv="Pragma" />
    <meta http-equiv="EXPIRES" content="0" />
    <!-- X-UA-Compatible: tells the Internet Explorer to display the page in the highest mode available -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport: to enable touch zooming and ensure proper rendering on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
</div>

<div th:fragment="header-css">
    <!-- this is header-css -->
    <link rel="stylesheet" type="text/css" href="/css/bootstrap-4.1.3-dist/css/bootstrap.min.css" th:href="@{/css/bootstrap-4.1.3-dist/css/bootstrap.min.css}" />
    <link rel="stylesheet" type="text/css" href="/css/main.css" th:href="@{/css/main.css}" />
</div>
</head>

<body>
    <div th:fragment="header-nav">
        <!-- this is header -->
        <nav class="navbar navbar-inverse">
            <div class="container">
                <div class="navbar-header">
                    <a class="navbar-brand" th:href="@{/}">Spring Boot</a>
                </div>
                <div id="navbar" class="collapse navbar-collapse">
                    <ul class="nav navbar-nav">
                        <li class="active"><a th:href="@{/}">Home</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>

</body>

</html>
