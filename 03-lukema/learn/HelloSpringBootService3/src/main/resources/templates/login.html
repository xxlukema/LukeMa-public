<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/security/tags">

<head>
<title>Thymeleaf + Security - login</title>
<div th:insert="fragments/header :: header-meta"></div>
<div th:insert="fragments/header :: header-css"></div>
</head>

<body>

    <div th:insert="fragments/header :: header-nav"></div>

    <div class="container">

        <h1 th:inline="text">Hello [[${#httpServletRequest.remoteUser}]]!</h1>

        <div class="row" style="margin-top: 20px">
            <div class="col-xs-12 col-sm-8 col-md-6 col-sm-offset-2 col-md-offset-3">
                <!-- When POST actions /login or /logout is called, HttpSecurity.formLogin() or HttpSecurity.logout() will be invoked. -->
                <form th:action="@{/login}" method="post">
                    <fieldset>
                        <h1>Please Sign In</h1>

                        <div th:if="${param.error}">
                            <div class="alert alert-danger">Invalid username and password.</div>
                        </div>
                        <div th:if="${param.logout}">
                            <div class="alert alert-info">You have been logged out.</div>
                        </div>

                        <div class="form-group">
                            <input type="text" name="username" id="username" class="form-control input-lg" placeholder="username" required="required" autofocus="autofocus" />
                        </div>
                        <div class="form-group">
                            <input type="password" name="password" id="password" class="form-control input-lg" placeholder="password" required="required" />
                        </div>

                        <div class="row">
                            <div class="col-xs-6 col-sm-6 col-md-6">
                                <input type="submit" class="btn btn-lg btn-primary btn-block" value="Sign In" />
                            </div>
                            <div class="col-xs-6 col-sm-6 col-md-6"></div>
                        </div>
                    </fieldset>
                </form>
            </div>
        </div>

    </div>

    <div class="container">
        <div th:insert="fragments/footer :: footer"></div>
    </div>

</body>

</html>
