# mongod.conf

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# where to write logging data.
systemLog:
  destination: file
  logAppend: true
  path: /var/log/mongodb/mongod.log

# Where and how to store data.
storage:
  dbPath: /var/lib/mongo

# how the process runs
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# network interfaces
net:
  port: 27017
  # (default) bindIp: 127.0.0.1  # Enter 0.0.0.0,:: to bind to all IPv4 and IPv6 addresses or, alternatively, use the net.bindIpAll setting.
  # bindIp: 127.0.0.1,mongodb_server_ip
  # bindIp: 127.0.0.1, 52.3.85.231
  bindIpAll: true   # <========= new for lukedb

security:
  authorization: enabled # <========= new for lukedb

#operationProfiling:

#replication:

#sharding:

## Enterprise-Only Options

#auditLog:
