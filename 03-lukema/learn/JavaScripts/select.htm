<!doctype HTML PUBLIC "-//W3C//DTD HTML 4.0 Transitional//EN">
<html>
<head>
   <title>Controlling TAB Order</title>
</head>

<script type="text/javascript">
var ids = new Array("focusA", "focusB");

function setTabFocus()
{
   for ( var i = 0; i < ids.length; i++ )
   {
      id = ids[i];

      fElement = document.getElementById(id);

      if ( fElement != null )
      {
         fElement.focus();
         break;
      }
   }
}
</script>

<body BGCOLOR="#FDF5E6" ONLOAD="setTabFocus();">

<h2 ALIGN="CENTER">Controlling TAB Order</h2>

<form ACTION="http://localhost:8088/SomeProgram">
   no to: 
   <input TYPE="TEXT" NAME="field1" >
   <br>
   to 6: 
   <input TPE="TEXT" NAME="field2" TABINDEX="6">
   <br>
   to 1: 
   <input ID="focusA" tabindex="1" TYPE="TEXT" NAME="field1" VALUE="enter your name here">
   <br>
   to 2 (select): 
   <input TYPE="TEXT" NAME="field3" TABINDEX="2" ONFOCUS="this.select();" VALUE="enter your e-mail">
   <br>
   to -1: 
   <input TYPE="TEXT" NAME="field4" TABINDEX="-1">
   <br>
   to 6: 
   <input TYPE="TEXT" NAME="field5" TABINDEX="6">
   <br>
   <a tabindex="3" HREF="http://www.google.com">to 3</a> <br>
   <a tabindex="5" HREF="http://www.google.com">to 5</a> <br>
</form>

<a onfocus="setTabFocus();" HREF=""></a> <br>

</body>
</html>
