plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    // application
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

apply plugin: 'application'

group = 'com.learn'
version = '0.0.1-SNAPSHOT'

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

configurations.all {
    exclude group: "org.apache.logging.log4j", module: "log4j-to-slf4j"
    exclude group: "org.springframework.boot", module: "spring-boot-starter-logging"
}

dependencies {
    // tag::actuator[]
    implementation ('org.springframework.boot:spring-boot-starter-actuator') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
    // end::actuator[]
    implementation ('org.springframework.boot:spring-boot-starter-web') {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }

    implementation 'org.springframework.boot:spring-boot-starter-log4j2'
    
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

test {
    useJUnitPlatform()
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    setSourceCompatibility(JavaVersion.VERSION_25)
    setTargetCompatibility(JavaVersion.VERSION_25)
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    // Define the main class for the application.
    mainClass = "com.learn.App"
}

tasks.register("hello") {
    group = "Custom"
    description = "A lovely greeting task."

    doLast {
        println("Hello world! I am hello.")
    }

    dependsOn(tasks.assemble)
}

tasks.register("intro") {
    doLast {
        println("I'm Intro")
    }

    dependsOn("hello")
}

tasks.register("taskX") {
    dependsOn("taskY")
    doLast {
        println("taskX")
    }
}

tasks.register("taskY") {
    doLast {
        println("taskY")
    }
}

// repeat(4) { counter ->
//     tasks.register("task$counter") {
//         doLast {
//             println("I'm task number $counter")
//         }
//     }
// }

// tasks.named("task0") { dependsOn("task2", "task3") }

tasks.named("hello") {
    doFirst {
        println("Hello doFirst")
    }
}

tasks.named("hello") {
    doLast {
        println("Hello doLast1")
    }
}

// the actions in the action list are executed in order.
tasks.named("hello") {
    doLast {
        println("Hello doLast2")
    }
}


