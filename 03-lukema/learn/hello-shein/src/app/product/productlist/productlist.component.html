<section>
  <app-loading [loading]="loading"></app-loading>
  <table mat-table [dataSource]="dataSource" class="full-width-table" matSort aria-label="Elements">
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>id</th>
      <td mat-cell *matCellDef="let row">{{row.id}}</td>
    </ng-container>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let row">{{row.name}}</td>
    </ng-container>
    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>description</th>
      <td mat-cell *matCellDef="let row">{{row.description}}</td>
    </ng-container>
    <ng-container matColumnDef="price">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>price</th>
      <td mat-cell *matCellDef="let row">{{row.price}}</td>
    </ng-container>
    <ng-container matColumnDef="imageLinks">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>images</th>
      <td mat-cell *matCellDef="let row">
        <div fxLayout fxLayoutAlign="start center" fxLayoutGap="0.5em">
          <img fxFlex="none" *ngFor="let prod of row.imageLinks" [src]="prod" style="height: 4em;">
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;" (click)="toDetails(row)"
      [class]="{highlighted: selection.isSelected(row)}"></tr>
  </table>

  <mat-paginator #paginator [length]="dataSource.data.length" (page)="page($event)" [pageIndex]="0"
    [pageSize]="listPageSize" [pageSizeOptions]="[5, 10, 20, 50]" aria-label="Select page">
  </mat-paginator>

</section>
