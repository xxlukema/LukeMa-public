<div>
	<h2>Sign In</h2>

	<div *ngIf="!message">
		Loading data. Please wait...
	</div>

	<p>1 {{message}}</p>
	<p>2 {{userService.user.username}}</p>
	<p>3 {{email2}} - {{password2}}</p>

	<form class="form-horizontal">
		<div class="form-group has-success has-feedback">
			<label class="col-sm-3 control-label" for="username">
				Username</label>
			<div class="col-sm-9">
				<input type="text" id="username" class="form-control" name="username" 
				       [(ngModel)]="userService.user.username" placeholder="* Username" title="* Username" required="true" />
				<span class="glyphicon glyphicon-user form-control-feedback"></span>
			</div>
		</div>
		<div class="form-group has-success has-feedback">
			<label class="col-sm-3 control-label" for="email">
				Email</label>
			<div class="col-sm-9">
				<input type="text" id="email" class="form-control" name="email" 
				       [(ngModel)]="userService.user.email" placeholder="* Username" title="* Username" required="true" />
				<span class="glyphicon glyphicon-user form-control-feedback"></span>
			</div>
		</div>
		<div class="form-group has-success has-feedback">
			<label class="col-sm-3 control-label" for="email2">
				Retype Email</label>
			<div class="col-sm-9">
				<input type="text" id="email2" class="form-control" name="email2" 
				       [(ngModel)]="email2" placeholder="* Username" title="* Username" required="true" />
				<span class="glyphicon glyphicon-user form-control-feedback"></span>
			</div>
		</div>
		<div class="form-group has-warning has-feedback">
			<label class="col-sm-3 control-label" for="password">
				Password</label>
			<div class="col-sm-9">
				<input type="password" class="form-control" id="password" name="password"
				       [(ngModel)]="userService.user.password" placeholder="* Password" title="* Password" required="true" />
				<span class="glyphicon glyphicon-lock form-control-feedback"></span>
			</div>
		</div>
		<div class="form-group has-warning has-feedback">
			<label class="col-sm-3 control-label" for="password2">
				Retype Password</label>
			<div class="col-sm-9">
				<input type="password" class="form-control" id="password2" name="password2"
				       [(ngModel)]="password2" placeholder="* Password" title="* Password" required="true" />
				<span class="glyphicon glyphicon-lock form-control-feedback"></span>
			</div>
		</div>
	
		<div class="form-group">
			<div class="col-sm-3"></div>
			<div class="col-sm-offset-right-4">
				<button (click)="loginAndRedirectToAdmin()" class="btn btn-primary btn-sm">Signin and Redirect to Admin</button>
			</div>
		</div>
	</form>
	
</div>
