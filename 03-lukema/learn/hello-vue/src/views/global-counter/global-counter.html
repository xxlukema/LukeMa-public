<section class="home">
  <div>
    <h3>Global Counter</h3>
    <h4><span style="background-color: lime;">Counter uses @Watch('mutated') to update state</span></h4>

    <button @click="deduct">Decrement</button>
    <span style="margin: 10px; font-weight: bold;">Counter: {{counter}}</span>
    <button @click="add">Increment</button>
  </div>

</section>
