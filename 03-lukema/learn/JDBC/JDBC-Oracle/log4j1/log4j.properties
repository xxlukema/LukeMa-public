
log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=### %d{yyyy-MM-dd HH:mm:ss} %-5p %C(%L) %M() %n%m%n

log4j.appender.file=org.apache.log4j.RollingFileAppender
log4j.appender.file.File=target/log.txt
log4j.appender.file.Append=false
log4j.appender.file.MaxFileSize=2MB
log4j.appender.file.MaxBackupIndex=4
log4j.appender.file.layout=org.apache.log4j.PatternLayout
log4j.appender.file.layout.ConversionPattern=### %d{yyyy-MM-dd HH:mm:ss} %-5p %C(%L) %M() %n%m%n

log4j.logger.org=warn

log4j.logger.com.learn=debug

log4j.logger.org.hibernate.SQL=trace
log4j.logger.org.hibernate.type.descriptor=trace

log4j.logger.org.springframework.jdbc.core=trace

#log4j.rootLogger=warn, stdout, other, com.learn, org.hibernate, org.springframework
log4j.rootLogger=warn, stdout, file


