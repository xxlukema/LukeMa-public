<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.springframework.org/security/tags">
<head>
<meta charset="ISO-8859-1" />
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
<meta content="no-cache" http-equiv="Cache-Control" />
<meta content="no-cache" http-equiv="Pragma" />
<meta http-equiv="EXPIRES" content="0" />
<!-- X-UA-Compatible: tells the Internet Explorer to display the page in the highest mode available -->
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<!-- viewport: to enable touch zooming and ensure proper rendering on mobile devices -->
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="css/bootstrap-3.3.7/dist/css/bootstrap.min.css" />
<link rel="stylesheet" href="css/main.css" />
<script type="text/javascript" src="css/bootstrap-3.3.7/dist/js/bootstrap.min.js"></script>
</head>
<body>

	<nav class="navbar navbar-inverse">
		<div class="container">
			<div class="navbar-header">
				<a class="navbar-brand" th:href="@{/}">Spring Boot</a>
			</div>
			<div id="navbar" class="collapse navbar-collapse">
				<ul class="nav navbar-nav">
					<li class="active"><a th:href="@{/}">Home</a></li>
				</ul>
			</div>
		</div>
	</nav>

	<div class="container">

		<div class="starter-template">
			<h1>403 - Access is denied</h1>
			<div th:inline="text">Hello '[[${#httpServletRequest.remoteUser}]]', you do not have permission to access this page.</div>
		</div>

	</div>
	<!-- /.container -->

	<div class="container">
		<footer>
			<!-- this is footer -->
			&copy; 2017 mkyong.com <span sec:authorize="isAuthenticated()"> | Logged user: <span sec:authentication="name"></span> | Roles: <span
				sec:authentication="principal.authorities"></span> | <a th:href="@{/logout}">Sign Out</a>
			</span>
		</footer>
	</div>


</body>
</html>
