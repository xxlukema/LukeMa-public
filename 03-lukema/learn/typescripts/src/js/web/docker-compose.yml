version: '3'
services:
  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - /home/ec2-user/nginxssl/http.conf:/etc/nginx/conf.d/default.conf
      - /home/ec2-user/nginxssl/https.conf:/etc/nginx/conf.d/https.conf
      - /home/ec2-user/nginxssl/example.key:/etc/nginx/ssl/example.key
      - /home/ec2-user/nginxssl/example.crt:/etc/nginx/ssl/example.crt
    depends_on:
      - serving
      - searching
  serving:
    image: node:14.15
    hostname: serving
    ports:
      - "3000:3000"
    volumes:
      - /home/ec2-user/web-servers/serving.js:/bin/serving.js
    command: bash -c "node /bin/serving.js"
  searching:
    image: node:14.15
    hostname: searching
    ports:
      - "3001:3001"
    volumes:
      - /home/ec2-user/web-servers/searching.js:/bin/searching.js
    command: bash -c "node /bin/searching.js"
