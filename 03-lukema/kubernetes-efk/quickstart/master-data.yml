apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: quickstart
spec:
  version: 8.6.1
  nodeSets:
  - name: master-nodes
    count: 1
    config:
      node.roles: ["master"]
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 2Gi
        # storageClassName: standard
  - name: data-nodes
    count: 1
    config:
      node.roles: ["data"]
    volumeClaimTemplates:
    - metadata:
        name: elasticsearch-data
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 4Gi
        # storageClassName: standard

---
# wisdom: extract `PersistentVolume` out of deployment to prevent `PersistentVolume` being deleted by `kubectl delete -f deployment.yml`
---
apiVersion: v1
kind: PersistentVolume
metadata:
  # name: elasticsearch-data-pv
  name: elasticsearch-data
  # labels:
  #   app: elasticsearch
spec:
  capacity:
    storage: 15Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /home/lma/tmp/elasticsearch-data
    type: DirectoryOrCreate
  persistentVolumeReclaimPolicy: Retain

---
# wosdom: extract `PersistentVolumeClaim` out of deployment to prevent `PersistentVolumeClaim` being deleted by `kubectl delete -f deployment.yml`
